    <path d="M-14 26 Q0 38 14 26" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(205 534) scale(0.44)">
    <path d="M0 -50 L46 38 L-46 38 Z" fill="#7E8287"/>
    <rect x="-16" y="-6" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-6" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 18 Q0 30 14 18" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(420 470) scale(0.3)">
    <circle r="46" fill="#C9CDD0"/>
    <circle cx="-12" cy="-3" r="5.5" fill="#101112"/>
    <circle cx="12" cy="-3" r="5.5" fill="#101112"/>
    <path d="M-13 15 Q0 27 13 15" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(812 470) scale(0.34)">
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#9AA0A5"/>
    <rect x="-16" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 14 Q0 28 14 14" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(1012 516) rotate(-8) scale(0.46)">
    <path d="M0 -50 L43 -25 L43 25 L0 50 L-43 25 L-43 -25 Z" fill="#F4F4F5"/>
    <rect x="-16" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 14 Q0 28 14 14" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(1130 470) scale(0.4)">
    <path d="M0 -50 L48 -15 L30 42 L-30 42 L-48 -15 Z" fill="#C9CDD0"/>
    <rect x="-16" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 14 Q0 28 14 14" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(1132 348) scale(0.32)">
    <path d="M0 -50 L46 38 L-46 38 Z" fill="#9AA0A5"/>
    <rect x="-16" y="-6" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-6" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 18 Q0 30 14 18" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- keep the centre calm -->
  <rect width="1200" height="600" fill="url(#fade)"/>

  <!-- centre mark -->
  <g transform="translate(170 150)">
    <path d="M60 9 L109 38 V82 L60 111 L11 82 V38 Z" fill="#F4F4F5" stroke="#F4F4F5" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M60 19 L100 43 V77 L60 101 L20 77 V43 Z" fill="none" stroke="#C9CDD0" stroke-width="1" stroke-linejoin="round" opacity="0.55"/>
    <rect x="34" y="45" width="21" height="41" rx="5.5" fill="#101112"/>
    <rect x="65" y="45" width="21" height="41" rx="5.5" fill="#101112"/>
    <circle cx="44.5" cy="62" r="4.4" fill="#F4F4F5"/>
    <circle cx="75.5" cy="62" r="4.4" fill="#F4F4F5"/>
    <path d="M49 94 Q60 103 71 94" fill="none" stroke="#101112" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="235" fill="#F4F4F5"
        font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700"
        letter-spacing="-1">BOT DASHBOARD</text>

  <!-- tagline -->
  <text x="600" y="326" text-anchor="middle" fill="#CDD0D2"
        font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700"
        letter-spacing="3">TWO PANES. ONE WORKSPACE.</text>
  <rect x="880" y="299" width="15" height="30" fill="#CDD0D2"/>

  <!-- subtitle -->
  <text x="600" y="386" text-anchor="middle" fill="#8B9095"
        font-family="Consolas, 'Courier New', monospace" font-size="21"
        letter-spacing="0.4">The Hermes desktop companion for bots and groups.</text>

  <!-- fine divider -->
  <path d="M438 428 H762" stroke="#2E3234" stroke-width="1"/>
  <path d="M600 423 L606 428 L600 433 L594 428 Z" fill="#C9CDD0"/>

  <!-- footer label -->
  <text x="600" y="566" text-anchor="middle" fill="#61666A"
        font-family="Consolas, 'Courier New', monospace" font-size="13"
        letter-spacing="4">HERMES DESKTOP  /  COMMUNITY PLUGIN</text>
