<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Bot Dashboard</title>
  <desc id="desc">Two panes. One workspace. The Hermes desktop companion for bots and groups.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1C1F20" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#101112" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#0A0B0C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#070809" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0B0C" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#0A0B0C" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#0A0B0C" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0B0C" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="600" fill="#101112"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <g fill="none" stroke="#222527" stroke-width="1" opacity="0.75">
    <ellipse cx="600" cy="300" rx="520" ry="300"/>
    <ellipse cx="600" cy="300" rx="700" ry="400"/>
    <ellipse cx="600" cy="300" rx="880" ry="510"/>
  </g>

