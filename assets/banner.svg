    <rect x="-16" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 14 Q0 28 14 14" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
