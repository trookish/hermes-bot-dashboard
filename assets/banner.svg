    <path d="M0 -50 L43 -25 L43 25 L0 50 L-43 25 L-43 -25 Z" fill="#C9CDD0"/>
    <rect x="-16" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 14 Q0 28 14 14" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(205 74) rotate(8) scale(0.34)">
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#7E8287"/>
    <rect x="-16" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 14 Q0 28 14 14" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(1092 88) rotate(6) scale(0.5)">
    <path d="M0 -50 L48 -15 L30 42 L-30 42 L-48 -15 Z" fill="#F4F4F5"/>
    <rect x="-16" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <rect x="9" y="-13" width="7" height="21" rx="3.5" fill="#101112"/>
    <path d="M-14 14 Q0 28 14 14" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(1138 218) scale(0.38)">
    <circle r="46" fill="#C9CDD0"/>
    <circle cx="-12" cy="-3" r="5.5" fill="#101112"/>
    <circle cx="12" cy="-3" r="5.5" fill="#101112"/>
    <path d="M-13 15 Q0 27 13 15" fill="none" stroke="#101112" stroke-width="5" stroke-linecap="round"/>
  </g>
