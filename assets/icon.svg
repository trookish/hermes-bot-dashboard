    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#171A1B" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0C0D" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" fill="#171A1B"/>
  <rect width="120" height="120" fill="url(#grid)"/>
  <rect width="120" height="120" fill="url(#vig)"/>

