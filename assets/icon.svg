  <rect x="65" y="45" width="21" height="41" rx="5.5" fill="#171A1B"/>

  <circle cx="44.5" cy="62" r="4.4" fill="#F4F4F5"/>
  <circle cx="75.5" cy="62" r="4.4" fill="#F4F4F5"/>

  <path d="M49 94 Q60 103 71 94" fill="none" stroke="#171A1B"
        stroke-width="3.2" stroke-linecap="round"/>
</svg>
